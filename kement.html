<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kement</title>
<link rel="stylesheet" href="ortak.css">
<style>
.orb{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:15}
.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
#combo{white-space:nowrap}
#prog.hot{background:linear-gradient(90deg,#ff7a3d,#ff3b3b)}
#score{transition:color .15s,text-shadow .15s}
#score.big{color:var(--accent);text-shadow:0 0 22px rgba(255,204,51,.75)}
</style>
</head>
<body class="game">
<div id="app">
  <header class="hud">
    <div class="stat"><small>REKOR</small><b id="best">0</b></div>
    <div class="score"><b id="score">0</b><span id="combo"></span><small id="sub"></small></div>
    <div class="stat"><small>SEVİYE</small><b id="lvl">1</b></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="stage"><canvas id="cv"></canvas></div>
</div>
<script src="ortak.js"></script>
<script>
const W=360,H=600,R=18,CAP=56,START=28,MIN_FIELD=26,COMBO_S=2.5,FEVER_AT=5,FUSE=10*60,LEVEL_S=20,LIVES=5,KEY='kement3';
const POWERS=[[3,'⚡'],[5,'🔥'],[8,'🌈'],[12,'💥']]; // combo streak rewards
const SNAP=40,NEAR=90,SKIP=15,EDGE=R*.8; // auto-close distance, preview distance, recent trail points ignored, how far the line's "magnet" reaches
const COLORS=['#ff5d73','#ffd23f','#4f8bff','#3ddc84','#a970ff'];
const SPR=[...COLORS,'#ffffff'].map(ballSprite); // last one = joker
const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
const LEVEL_MSG={2:'💣 Bombalar geldi: patlamadan halkala!',3:'🌈 Prizma geldi',5:'🟣 5. renk geldi!'};
const cv=$('#cv'),ctx=cv.getContext('2d'),view=watchCanvas(cv,W,H,6);
const stars=Array.from({length:44},()=>({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.35,s:.6+Math.random()*1.4}));
let Rn,lives,dots,spawns,score,disp,shown,combo,maxCombo,biggest,lastHit,gt,lt,level,nextSpawn,lastSpawn,frozenUntil,over,path,live,flashA,flashC,punch,quake,hitstop,
  edgeA=0,edgeC='#fff',bolts=[],rings,poppers,parts,flashes,ghosts,beatAt,defused,milestone,recordShown,startBest,popN=0,lastArr=0,lastPop=0;

function inPoly(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];
  if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)ins=!ins}return ins}
function distSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
const nearEdge=(p,poly)=>{for(let i=0,j=poly.length-1;i<poly.length;j=i++)if(distSeg(p,poly[j],poly[i])<EDGE)return true;return false};
// what a loop holds: any second colour inside makes it mixed (costs a heart);
// same-colour balloons sitting right on the line count as inside (fat-finger friendly)
function judge(poly){const inside=dots.filter(d=>inPoly(d,poly)),cnt={};inside.forEach(d=>{if(d.c>=0)cnt[d.c]=(cnt[d.c]||0)+1});
  const col=Object.keys(cnt).length?+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]:-1,strays=inside.filter(d=>d.c>=0&&d.c!==col);
  const ins=col<0?inside:[...inside,...dots.filter(d=>d.c===col&&!inside.includes(d)&&nearEdge(d,poly))];
  return{ins,col,strays,catch:ins.filter(d=>!strays.includes(d)),mixed:strays.length>0}}
// where segment ab crosses segment cd (strictly inside both), or null
function segX(a,b,c,d){const r1=b.x-a.x,r2=b.y-a.y,s1=d.x-c.x,s2=d.y-c.y,den=r1*s2-r2*s1;if(Math.abs(den)<1e-9)return null;
  const t=((c.x-a.x)*s2-(c.y-a.y)*s1)/den,u=((c.x-a.x)*r2-(c.y-a.y)*r1)/den;return t>0&&t<1&&u>0&&u<1?{x:a.x+t*r1,y:a.y+t*r2}:null}
const area=poly=>{let a=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)a+=(poly[j].x+poly[i].x)*(poly[j].y-poly[i].y);return Math.abs(a/2)};
// self-check: loop geometry, crossing detection, the one-stray rule, the line magnet
{const sq=[{x:0,y:0},{x:100,y:0},{x:100,y:100},{x:0,y:100}];console.assert(inPoly({x:50,y:50},sq)&&!inPoly({x:150,y:50},sq)&&area(sq)===1e4,'inPoly/area');
 const X=segX({x:0,y:0},{x:10,y:10},{x:0,y:10},{x:10,y:0});console.assert(X&&X.x===5&&X.y===5&&!segX({x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}),'segX');
 dots=[{x:30,y:30,c:0},{x:60,y:60,c:0},{x:50,y:40,c:-1}];console.assert(!judge(sq).mixed&&judge(sq).catch.length===3,'one colour + joker is clean');
 dots.push({x:105,y:50,c:0},{x:140,y:50,c:0});console.assert(judge(sq).catch.length===4,'same colour on the line counts, far away does not');
 dots.push({x:40,y:70,c:1});console.assert(judge(sq).mixed,'any second colour = mixed')}

// the day's stream of balloons (same for everyone); specials unlock with levels
const ncol=()=>level>=5?5:4;
function newItem(){const r=Rn(),c=Rn()*ncol()|0;let p=.06;if(r<p)return{c:-1,sp:'joker'};
  if(level>=2){p+=.07;if(r<p)return{c,sp:'bomb',fuse:FUSE}}p+=.025;if(r<p)return{c,sp:'ice'};if(level>=3){p+=.02;if(r<p)return{c,sp:'prism'}}return{c,sp:''}}
function placeItem(it,x,y){if(it.c>=0&&Rn()<.5){let nd=90,near=null;for(const o of dots)if(o.c>=0){const q=Math.hypot(o.x-x,o.y-y);if(q<nd){nd=q;near=o}}if(near)it={...it,c:near.c}}return it} // colours like company
function freeSpot(){let x,y;for(let k=0;k<25;k++){x=R+Rn()*(W-2*R);y=R+Rn()*(H-2*R);
  if(dots.every(o=>Math.hypot(o.x-x,o.y-y)>2*R+8)&&spawns.every(o=>Math.hypot(o.x-x,o.y-y)>2*R+8))break}return[x,y]}
const makeDot=(it,x,y,sz=.2)=>({...it,x,y,vx:(Rn()-.5)*.5,vy:(Rn()-.5)*.5,hot:0,ph:Rn()*6.28,sz,sq:0,kx:0,ky:0});
function queueSpawn(){const[x,y]=freeSpot();spawns.push({it:placeItem(newItem(),x,y),x,y,t:22})}
const basePace=()=>Math.max(.2,.95-(level-1)*.075), speedK=()=>Math.min(1.4,1+(level-1)*.06);
const crowd=()=>(dots.length+spawns.length)/CAP, feverOn=()=>combo>=FEVER_AT, colOf=d=>d.c<0?'#ffffff':COLORS[d.c];

function start(){Rn=rng(DAY+'-'+KEY);lives=LIVES;startBest=bestOf(KEY);dots=[];spawns=[];level=1;gt=lt=0;
  for(let i=0;i<START;i++){const[x,y]=freeSpot();dots.push(makeDot(placeItem(newItem(),x,y),x,y,1))}
  nextSpawn=1.2;lastSpawn=0;frozenUntil=0;score=disp=shown=combo=maxCombo=biggest=lastHit=flashA=punch=quake=hitstop=beatAt=defused=0;milestone=1500;recordShown=over=false;path=live=null;
  rings=[];poppers=[];parts=[];flashes=[];ghosts=[];bolts=[];flashC='#fff';hud()}
const bump=el=>{el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')};
function hud(){$('#best').textContent=Math.max(score,bestOf(KEY));$('#lvl').textContent=level;
  $('#sub').textContent=['❤️'.repeat(lives)+'🖤'.repeat(LIVES-lives),TARGET&&(score>TARGET?'✅ Hedefi geçtin':'🎯 Hedef '+TARGET)].filter(Boolean).join(' · ');
  const cb=$('#combo');cb.textContent=(feverOn()?'🔥x2 · ':'')+'KOMBO x'+combo+' → '+nextPower();cb.classList.toggle('on',combo>0);
  cb.style.background=feverOn()?'linear-gradient(90deg,#ff7a3d,#ff3d6e)':''}

// a glowing orb flies on an arc from where a balloon popped to the score
function flyTo(sel,wx,wy,color,delay,onArrive){const v=view,t=$(sel).getBoundingClientRect(),x0=v.r.left+v.ox+wx*v.s,y0=v.r.top+v.oy+wy*v.s,x1=t.left+t.width/2,y1=t.top+t.height/2;
  const e=document.createElement('i');e.className='orb';e.style.background=color;e.style.boxShadow=`0 0 14px 4px ${color}`;document.body.append(e);
  const mx=(x0+x1)/2+(Math.random()-.5)*180,my=y1+(y0-y1)*.35;
  e.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`},{transform:`translate(${mx}px,${my}px) scale(1.5)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.5)`}],
    {duration:720,delay,easing:'ease-in',fill:'both'}).onfinish=()=>{e.remove();onArrive()}}
function arrive(sel){bump($(sel));const now=performance.now();if(now-lastArr>35){lastArr=now;beep(1100+Math.random()*400,.03,'sine',.035);buzz(16)}}

// drawing: no straight auto-close. Crossing your own trail closes a loop right there and you keep drawing.
addEventListener('pointerdown',e=>{if(over||e.target.closest('button,a,.ov'))return;path=[toWorld(e,view)];live=null});
addEventListener('pointermove',e=>{if(!path)return;const evs=e.getCoalescedEvents?.();for(const ev of evs?.length?evs:[e])addPoint(toWorld(ev,view))});
addEventListener('pointerup',()=>{const nc=path&&nearClose(SNAP+10);path=live=null;if(nc&&catchable(judge(nc.poly)))closeLoop(nc.poly)}); // let go near your trail around a clean group: it closes
addEventListener('pointercancel',()=>{path=live=null});
function addPoint(p){if(!path)return;const l=path[path.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)<4)return;
  for(let i=path.length-3;i>=0;i--){const X=segX(path[i],path[i+1],l,p);if(X){const poly=[X,...path.slice(i+1)];path=[X,p];closeLoop(poly);return}}
  path.push(p);if(path.length>600)path.shift();trail(p);
  // almost closed and something worth catching inside: finish the loop for the player
  const nc=nearClose(SNAP);if(nc&&area(nc.poly)>600&&catchable(judge(nc.poly))){path=[p];beep(1800,.04,'square',.05);buzz(30);closeLoop(nc.poly)}}
// nearest earlier point of the trail to the fingertip (ignoring the last few), within max
function nearClose(max=NEAR){if(!path||path.length<=SKIP)return null;const tip=path.at(-1);let best=-1,bd=max;
  for(let i=0;i<path.length-SKIP;i++){const d=Math.hypot(path[i].x-tip.x,path[i].y-tip.y);if(d<bd){bd=d;best=i}}return best<0?null:{i:best,d:bd,poly:path.slice(best)}}
const catchable=j=>!j.mixed&&(j.catch.length>=2||j.catch.some(d=>d.sp&&d.sp!=='joker'));
function closeLoop(poly){if(over||area(poly)<900)return;resolve(poly)} // ignore tiny accidental loops

const loopColor=j=>j.mixed?'#ff3b3b':j.catch.length>1?(j.col>=0?COLORS[j.col]:'#ffffff'):'#c8ccff';
function trail(p){const c=live?loopColor(live):`hsl(${performance.now()/4%360},90%,70%)`;
  for(let k=0;k<2;k++)parts.push({t:'spark',x:p.x,y:p.y,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,g:.03,drag:.94,rot:0,vr:0,life:.7,decay:.04,color:c,s:1.8})}

function resolve(poly){const j=judge(poly);if(!j.ins.length)return;
  const cx=j.ins.reduce((s,d)=>s+d.x,0)/j.ins.length,cy=j.ins.reduce((s,d)=>s+d.y,0)/j.ins.length;
  if(j.mixed){combo=0;lives--;j.ins.forEach(d=>d.hot=30);ghosts.push({pts:poly,col:'#ff3b3b',t:0}); // mixing colours costs a heart
    float('💔 KARIŞIK! −1 can',clamp(cx,120,W-120),cy,'#ff5d73',28);flashA=.35;flashC='#ff3b3b';quake=10;sweep(300,80,.4,'sawtooth',.1);buzz([150,60,150]);hud();
    if(lives<=0)gameOver('mixed');return}
  const got=j.catch;if(got.length<2&&!got.some(d=>d.sp&&d.sp!=='joker'))return; // a lone plain balloon is worth nothing; a lone special is fine
  // specials: bomb blasts its surroundings, prism takes its whole colour, ice freezes; they can set each other off
  const kill=new Set(got),fired=[];
  for(let grew=true;grew;){grew=false;for(const d of[...kill])if(!fired.includes(d)&&(d.sp==='bomb'||d.sp==='prism'||d.sp==='ice')){fired.push(d);if(d.sp==='ice')continue;
    for(const o of dots)if(!kill.has(o)&&(d.sp==='bomb'?Math.hypot(o.x-d.x,o.y-d.y)<100:o.c===d.c)){kill.add(o);grew=true}}}
  const n=got.length,k=kill.size;combo++;maxCombo=Math.max(maxCombo,combo);biggest=Math.max(biggest,k);lastHit=gt;
  const gain=(n*n*5+(k-n)*15)*Math.min(combo,10)*(feverOn()?2:1);score+=gain;keepBest(KEY,score); // multiplier capped at x10; best saved right away so leaving mid-game keeps it
  defused+=fired.filter(d=>d.sp==='bomb').length;
  const col=got.find(d=>d.c>=0)?COLORS[got.find(d=>d.c>=0).c]:'#ffffff';
  // balloons pop where they are: the loop's catch goes pa-pa-pa around the ring, bomb/prism extras ripple outward
  const ang=d=>Math.atan2(d.y-cy,d.x-cx),share=Math.floor(gain/k);
  [...got].sort((a,b)=>ang(a)-ang(b)).forEach((d,i)=>poppers.push({...d,t:3+i*3,i,pts:share}));
  [...kill].filter(d=>!got.includes(d)).forEach((d,i)=>poppers.push({...d,t:8+Math.hypot(d.x-cx,d.y-cy)/7|0,i:n+i,pts:share}));
  poppers[poppers.length-1].pts+=gain-share*k;
  dots=dots.filter(d=>!kill.has(d));ghosts.push({pts:poly,col,t:0});
  fired.forEach((d,i)=>setTimeout(()=>{
    if(d.sp==='bomb'){fireBlast(d.x,d.y,10);float('💥 ETKİSİZ!',d.x,d.y-26,'#ffb020',24)}
    else if(d.sp==='prism'){rings.push({x:d.x,y:d.y,r:R,max:W,col:COLORS[d.c],t:0});float('🌈 RENK PATLADI!',W/2,H*.3,COLORS[d.c],30);sweep(300,1500,.5,'triangle',.08);flashA=.5;flashC=COLORS[d.c];quake=10;fireworks(2);buzz([50,30,50,30,50,30,160])}
    else{frozenUntil=gt+3.5;float('❄️ DONDU!',W/2,H*.3,'#9be7ff',38);sweep(2400,700,.5,'triangle',.06);flashA=.45;flashC='#9be7ff';buzz([30,25,30,25,30,25,90])}},120+i*170));
  setTimeout(()=>explode(cx,cy,col,k,gain),(3+n*3+4)*17); // the finale, right after the last pop
  sweep(300,700,.12,'sine',.05);if(combo>1)bump($('#combo'));
  if(combo===FEVER_AT)setTimeout(()=>{float('🔥 ATEŞ MODU! x2',W/2,H*.24,'#ff7a3d',32);sweep(300,1200,.45,'square',.05);quake=8;fireworks(4);buzz([120,60,120,60,300])},260);
  if(k>=8&&lives<LIVES){lives++;setTimeout(()=>{float('+1 ❤️',W/2,H*.4,'#ff5d73',34);beep(880,.15,'triangle',.08);setTimeout(()=>beep(1320,.2,'triangle',.07),120);buzz([40,40,120])},300)} // a huge loop earns a heart back
  comboPower();milestones();hud()}

// streak rewards: free blasts at combo 3 (⚡ lightning), 8 (🌈 the most common colour), 12 and every 5 after (💥 the middle); combo 5 is fever
function comboPower(){const each=15*Math.min(combo,10);
  const blast=(list,label,color,delay=8)=>{if(!list.length)return;list.forEach((d,i)=>poppers.push({...d,t:delay+i*2,i:i%11,pts:each}));dots=dots.filter(d=>!list.includes(d));
    score+=each*list.length;keepBest(KEY,score);setTimeout(()=>banner(label,color),120)};
  if(combo===3){const t=[...dots].sort(()=>Math.random()-.5).slice(0,4);t.forEach(d=>bolts.push({x:d.x,y:d.y,t:0,seed:Math.random()}));
    blast(t,'⚡ ŞİMŞEK!','#9be7ff',6);flashA=.35;flashC='#bfe9ff';sweep(2200,90,.35,'sawtooth',.09);buzz([40,20,40,20,120])}
  else if(combo===8){const cnt={};dots.forEach(d=>{if(d.c>=0)cnt[d.c]=(cnt[d.c]||0)+1});const c=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    blast(dots.filter(d=>d.c===c).sort((a,b)=>a.y-b.y),'🌈 GÖKKUŞAĞI!',COLORS[c]);rings.push({x:W/2,y:H/2,r:R,max:W,col:COLORS[c],t:0});fireworks(2);buzz([50,30,50,30,50,30,180])}
  else if(combo>=12&&(combo-12)%5===0){const dc=d=>Math.hypot(d.x-W/2,d.y-H/2);blast(dots.filter(d=>dc(d)<170).sort((a,b)=>dc(a)-dc(b)),'💥 SÜPER PATLAMA!','#ff7a3d');
    rings.push({x:W/2,y:H/2,r:R,max:W,col:'#ff7a3d',t:0});quake=16;hitstop=5;fireworks(4);popSfx(.6,300,.4);buzz([150,50,150,50,300])}}
const nextPower=()=>{for(const[c,i]of POWERS)if(combo<c)return i+c;return '💥'+(12+5*Math.ceil((combo-11)/5))};

// one balloon bursting; the burst style rotates so a chain never looks the same twice
function balloonPop(p){const c=colOf(p),style=popN++%4,rnd=Math.random;
  if(style===0)for(let i=0;i<10;i++){const a=rnd()*6.283,v=2+rnd()*4.5;parts.push({t:'shard',x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.18,drag:.97,rot:a,vr:(rnd()-.5)*.5,life:1,decay:.022,color:c,s:4+rnd()*5})} // rubber shreds
  else if(style===1)for(let i=0;i<7;i++){const a=rnd()*6.283,v=2+rnd()*3.5;parts.push({t:'star',x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,g:.1,drag:.97,rot:a,vr:.2,life:1,decay:.02,color:i%2?'#ffe58a':'#ffffff',s:5+rnd()*4})}
  else if(style===2)for(let i=0;i<5;i++)parts.push({t:'heart',x:p.x+(rnd()-.5)*20,y:p.y,vx:(rnd()-.5)*1.5,vy:-1.5-rnd()*2,g:-.02,drag:.98,rot:0,vr:0,life:1,decay:.018,color:i%2?c:'#ff7ad9',s:14+rnd()*10}) // hearts float up
  else for(let i=0;i<14;i++){const a=i/14*6.283;parts.push({t:'spark',x:p.x,y:p.y,vx:Math.cos(a)*3.8,vy:Math.sin(a)*3.8,g:.03,drag:.93,rot:0,vr:0,life:1,decay:.035,color:i%2?c:'#ffffff',s:2.5})} // sparkle ring
  for(let i=0;i<5;i++){const a=rnd()*6.283,v=1.5+rnd()*3.5;parts.push({t:'conf',x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.5,g:.12,drag:.98,rot:rnd()*6,vr:(rnd()-.5)*.6,life:1,decay:.012,color:COLORS[rnd()*5|0]})}
  burst(p.x,p.y,'#ffffff',4);rings.push({x:p.x,y:p.y,r:R*.6,max:R*2.6,col:c,t:0});flashes.push({x:p.x,y:p.y,t:0});
  if(p.pts){float('+'+p.pts,p.x+(Math.random()-.5)*18,p.y-8,'#ffffff',22+Math.min(p.i,6));flyTo('#score',p.x,p.y,c,0,()=>{disp+=p.pts;arrive('#score')})}
  const now=performance.now();if(now-lastPop>25){lastPop=now;popSfx(.35,1300+rnd()*1000,.07);beep(523*2**(PENTA[Math.min(p.i,10)]/12),.08,'triangle',.05)}buzz(35)}
// fiery blast with smoke (bombs)
function fireBlast(x,y,q){const rnd=Math.random;for(let i=0;i<18;i++){const a=rnd()*6.283,v=2+rnd()*6;parts.push({t:'shard',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.18,drag:.97,rot:a,vr:(rnd()-.5)*.6,life:1,decay:.022,color:['#ff3b3b','#ffb020','#ffd23f'][i%3],s:4+rnd()*7})}
  for(let i=0;i<8;i++)parts.push({t:'smoke',x:x+(rnd()-.5)*30,y:y+(rnd()-.5)*30,vx:0,vy:-.3-rnd()*.5,g:0,drag:1,rot:0,vr:0,life:1,decay:.018,color:'#8a8fa8',s:10+rnd()*12});
  burst(x,y,'#ffb020',24);rings.push({x,y,r:R,max:130,col:'#ff9a3d',t:0});flashes.push({x,y,t:0,big:1});
  quake=Math.max(quake,q);hitstop=3;popSfx(.6,380,.35);sweep(150,35,.5,'sawtooth',.14);buzz([120,50,160])}
// celebration: rockets climb from the bottom and burst into sparks and stars

  if(edgeA>.02){ctx.globalAlpha=edgeA;ctx.strokeStyle=edgeC;ctx.lineWidth=14;ctx.shadowColor=edgeC;ctx.shadowBlur=26;ctx.strokeRect(0,0,W,H);ctx.shadowBlur=0;ctx.globalAlpha=1}
  if(gt<6&&!over&&score===0){ctx.globalAlpha=.7+.3*Math.sin(now/300);ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.fillText('✍️ Aynı renk balonların etrafına halka çiz',W/2,H-50);
    ctx.font='600 13px system-ui';ctx.fillText('Başka renk karışırsa −1 can · 💣 patlamadan yakala',W/2,H-26);ctx.globalAlpha=1}
  ctx.restore();
  ctx.lineWidth=fever?2.5:1.5;ctx.strokeStyle=fever?`hsl(${now/3%360},100%,60%)`:danger?'#ff3b3b':'#2a3150';ctx.beginPath();ctx.roundRect(0,0,W,H,18);ctx.stroke();
  if(shown<disp)shown+=Math.ceil((disp-shown)/5);else shown=disp;$('#score').textContent=shown;
  const pg=$('#prog');pg.style.width=Math.min(100,c*100)+'%';pg.classList.toggle('hot',c>.8)}

start();loop(step,draw);
</script>
