<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zincir</title>
<link rel="stylesheet" href="ortak.css">
</head>
<body class="game">
<div id="app">
  <header class="hud">
    <div class="stat"><small>BÖLÜM</small><b id="lvl">1/5</b></div>
    <div class="score"><b id="score">0</b><small id="sub"></small></div>
    <div class="stat"><small>HEDEF</small><b id="goal">0/0</b></div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <p id="hint">Her bölümde tek dokunuş hakkın var · patlama değdiği topları da patlatır</p>
</div>
<script src="ortak.js"></script>
<script>
const W=360,H=520,BR=8,ER=50,GROW=14,HOLD=90,GONE=106;
const LEVELS=[[10,3],[16,6],[24,12],[32,16],[42,24]]; // [balls, target]
const COLORS=['#ff5d73','#ffd23f','#4f8bff','#3ddc84','#a970ff','#26c6da'];
const SPR=COLORS.map(ballSprite);
const cv=$('#cv'),ctx=cv.getContext('2d'),view=watchCanvas(cv,W,H);
let lvl,balls,booms,caught,total,shown,results,tapped,phase,nextAt,lastBeep=0;

function startLevel(i){lvl=i;const Rn=rng(DAY+'-zincir-'+i);
  balls=Array.from({length:LEVELS[i][0]},()=>{const a=Rn()*6.283,sp=.8+Rn()*.6;
    return{x:BR+Rn()*(W-2*BR),y:BR+Rn()*(H-2*BR),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:Rn()*COLORS.length|0}});
  booms=[];caught=0;tapped=false;phase='play';hud()}
function start(){total=shown=0;results=[];startLevel(0)}
function hud(){const[,t]=LEVELS[lvl];$('#lvl').textContent=`${lvl+1}/${LEVELS.length}`;$('#goal').textContent=`${caught}/${t}`;
  $('#prog').style.width=Math.min(100,caught/t*100)+'%';
  const b=Math.max(total,bestOf('zincir'));$('#sub').textContent=[b&&'⭐ Rekor '+b,TARGET&&(total>TARGET?'✅ Hedefi geçtin':'🎯 Hedef '+TARGET)].filter(Boolean).join(' · ')}

cv.addEventListener('pointerdown',e=>{if(!balls||!$('#over').hidden)return;
  if(phase==='result'){nextAt=0;return} // tap to skip the pause
  if(phase!=='play'||tapped)return;const p=toWorld(e,view);if(p.x<0||p.x>W||p.y<0||p.y>H)return;
  tapped=true;booms.push({x:p.x,y:p.y,t:0,r:0,c:'#ffffff'});beep(180,.15,'sine',.15);buzz(15)});

function pop(b){burst(b.x,b.y,COLORS[b.c],6);const now=performance.now();
  if(now-lastBeep>45){lastBeep=now;beep(330*2**(Math.min(caught,30)/12),.09,'triangle',.09);buzz(8)}}

function step(){if(!balls)return;
  if(phase==='result'&&performance.now()>=nextAt){if(lvl<LEVELS.length-1)startLevel(lvl+1);else done();return}
  for(const b of balls){b.x+=b.vx;b.y+=b.vy;if(b.x<BR&&b.vx<0||b.x>W-BR&&b.vx>0)b.vx*=-1;if(b.y<BR&&b.vy<0||b.y>H-BR&&b.vy>0)b.vy*=-1}
  for(const e of booms){e.t++;e.r=e.t<GROW?ER*Math.sin(e.t/GROW*Math.PI/2):e.t<HOLD?ER:ER*Math.max(0,1-(e.t-HOLD)/(GONE-HOLD))}
  booms=booms.filter(e=>e.t<GONE);
  let hit=false;
  for(let i=balls.length;i--;){const b=balls[i];
    if(booms.some(e=>e.t<HOLD&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+BR)){balls.splice(i,1);booms.push({x:b.x,y:b.y,t:0,r:0,c:COLORS[b.c]});caught++;total++;pop(b);hit=true}}
  if(hit)hud();
  if(phase==='play'&&tapped&&!booms.length){const[,t]=LEVELS[lvl],ok=caught>=t;results.push(caught);phase='result';nextAt=performance.now()+1700;
    beep(ok?660:220,.2,'triangle');if(ok){shake();buzz([20,30,40])}}}

function done(){phase='done';const passed=results.filter((c,i)=>c>=LEVELS[i][1]).length;
  const card=results.map((c,i)=>c>=LEVELS[i][1]?'🟩':c>=LEVELS[i][1]/2?'🟨':'🟥').join('')+'\n';
  finish({key:'zincir',score:total,unit:'top',title:passed===LEVELS.length?'Kusursuz gün! 🎉':'Günün bölümleri bitti',
    chips:[`✅ ${passed}/${LEVELS.length} bölüm`,`💥 en uzun zincir: ${Math.max(...results)}`],card,again:start})}

function draw(){const v=view;if(!v.s||!balls)return;const now=performance.now();worldView(ctx,cv,v);
  ctx.fillStyle='#141829';ctx.strokeStyle='#2a3150';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(0,0,W,H,18);ctx.fill();ctx.stroke();
  ctx.save();ctx.clip();
  for(const e of booms){const a=e.t<HOLD?1:Math.max(0,1-(e.t-HOLD)/(GONE-HOLD));
    ctx.globalAlpha=.22*a;ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.283);ctx.fill();
    ctx.globalAlpha=.8*a;ctx.strokeStyle=e.c;ctx.lineWidth=2;ctx.stroke()}
  ctx.globalAlpha=1;
  for(const b of balls)drawBall(ctx,SPR[b.c],b.x,b.y,BR);
  drawFx(ctx);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(phase==='play'&&!tapped){ctx.globalAlpha=.55+.3*Math.sin(now/300);ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.fillText('👆 Doğru anda bir yere dokun',W/2,H-26);ctx.globalAlpha=1}
  if(phase==='result'){const[n,t]=LEVELS[lvl],ok=caught>=t;ctx.fillStyle='rgba(13,15,26,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=ok?'#3ddc84':'#ff5d73';ctx.font='900 54px system-ui';ctx.fillText(`${caught}/${n}`,W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText(ok?'✅ Bölüm geçildi':`❌ Hedef ${t} idi`,W/2,H/2+28);
    ctx.fillStyle='#8a90b3';ctx.font='600 13px system-ui';ctx.fillText(lvl<LEVELS.length-1?'dokun → sonraki bölüm':'',W/2,H/2+58)}
  ctx.restore();
  if(shown<total)shown+=Math.ceil((total-shown)/6);else shown=total;$('#score').textContent=shown}

start();loop(step,draw);
</script>
</body>
</html>
